# Deploy the latest configurator and frozen archives together. Vite copies
# webapp/public/versions into dist/versions; npm run build checks their hashes.
name: Deploy configurator

on:
  push:
    branches: [main]
    paths: ['webapp/**', 'webUploader/**', 'releases/**', '.gitmodules', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build beta uploader and test bootloader protocol
        run: |
          node ../webUploader/build.mjs
          node --test ../webUploader/tests/*.test.mjs
      - name: Build latest configurator and verify frozen archives
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
